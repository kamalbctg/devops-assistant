# Schema migrations. The app applies them on start; use the CLI to add one:
#   uv run alembic revision --autogenerate -m "add x to agents"
# The database is DATABASE_URL, or the local SQLite file under DATA_DIR (.data).
[alembic]
script_location = src/main/python/incident_agent/persistence/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src/main/python

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
