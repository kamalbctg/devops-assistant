  // apply the saved theme before the page paints (no flash)

<body>
<header>
  <a class="logo" href="#/" style="color:inherit;text-decoration:none"><span></span>DevOps Agents</a>
  <nav><a href="/docs" target="_blank">API</a></nav>
  <div class="right"><span id="health"></span><button class="theme-btn" id="themeBtn" title="Switch theme"></button></div>
</header>
<div class="layout">
  <aside id="nav"></aside>
  <main id="main"></main>
</div>

<script>
// All text from the server (logs, alert titles, names) is escaped before rendering.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const $ = id => document.getElementById(id);
const badge = (v, cls) => `<span class="badge b-${esc(cls || v)}">${esc(String(v).replace(/_/g, " "))}</span>`;
const modeBadge = m => badge(m === "fake" ? "demo data" : "live", m);
const ago = t => { if (!t) return "never"; const s = Math.round(Date.now() / 1000 - t); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; };
const CAP_LABEL = {"alerts.list": "alerts", "metrics.query": "metrics", "logs.search": "logs", "traces.search": "traces", "deploys.list": "deploys", "k8s.events": "pod events", "k8s.pods": "pod health"};
// "https://app.datadoghq.com/monitors/123?…&event_ts=…" → "Datadog monitor #123 · alert Oct 7, 10:04"
function runTitle(q) {
  const m = String(q || "").match(/https:\/\/app\.\S*datad\S*\/monitors\/(\d+)\S*/);
  if (!m) return q;
  let ts = null;
  try { const u = new URL(m[0]); ts = u.searchParams.get("event_ts") || u.searchParams.get("link_event_ts") || u.searchParams.get("to_ts"); } catch (e) { /* not a URL */ }
  const at = ts ? " · alert " + new Date(+ts > 1e12 ? +ts : +ts * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
  const rest = q.replace(m[0], "").trim();
  return `🔔 Datadog monitor #${m[1]}${at}` + (rest ? ` — ${rest}` : "");
}
// ------------------------------------------------------------------ theme: system → light → dark → system
const THEMES = {system: "◐ System", light: "☀ Light", dark: "☾ Dark"};
function currentTheme() { return document.documentElement.dataset.theme || "system"; }
function setTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { t === "system" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t); } catch (e) { /* storage blocked */ }
  $("themeBtn").textContent = THEMES[t];
}
function wireTheme() {
  const order = ["system", "light", "dark"];
  $("themeBtn").textContent = THEMES[currentTheme()];
  $("themeBtn").onclick = () => setTheme(order[(order.indexOf(currentTheme()) + 1) % order.length]);
}

const caps = list => list.map(c => CAP_LABEL[c] || c).join(", ");



async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"content-type": "application/json"}, ...opts});
  if (r.status === 204) return null;
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail || r.statusText));
  return body;
}
const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});
const put = (path, body) => api(path, {method: "PUT", body: JSON.stringify(body)});
const del = path => api(path, {method: "DELETE"});

function go(hash) { location.hash = hash; }
async function refreshConfig() { [AGENTS, CONNECTORS, LLM] = await Promise.all([api("/agents"), api("/connectors"), api("/llm")]); }

async function route() {
  const h = location.hash || "#/";
  if (stream) { stream.close(); stream = null; }
  const parts = h.slice(2).split("/").filter(Boolean);
  current = null; activeAgent = null; navSection = parts[0] || null;
  $("main").classList.remove("wide"); liveRun = null;
  await refreshConfig();
  if (["run", "agent", ""].includes(parts[0] || "")) navSection = "agents";
  if (parts[0] === "run") { await openRun(parts[1]); return renderNav(); }
  if (parts[0] === "agent" && parts[1]) { activeAgent = parts[1]; renderNav(); return renderAgentHome(parts[1]); }
  renderNav();
  if (parts[0] === "connectors") {
    if (parts[1] === "new") return parts[2] ? renderConnectorForm(null, parts[2]) : renderTypePicker();
    if (parts[1]) return renderConnectorForm(parts[1]);
    return renderConnectors();
  }
  if (parts[0] === "llm") return renderLLM();
  if (parts[0] === "agents") {
    if (parts[1] === "new") return parts[2] ? renderAgentForm(null, parts[2]) : renderAgentTypePicker();
    if (parts[1] && parts[2] === "edit") return renderAgentForm(parts[1]);
  }
  if (!AGENTS.length && !CONNECTORS.length) return renderWelcome();
  renderAgentCards();
}

// Stop: the current step finishes, then the report is written from what was found so far
const stoppable = run => run.status === "running" || run.status === "waiting_input";
const stopping = run => (run.events || []).some(e => e.node === "stop");
const stopBtn = (run, id) => stoppable(run) ? `<button class="btn small danger" id="${id}" ${stopping(run) ? "disabled" : ""}>${stopping(run) ? "Stopping…" : "Stop"}</button>` : "";
function wireStop(run, id) {
  const b = $(id);
  if (!b || b.disabled) return;
  b.onclick = async () => {
    if (!confirm("Stop this investigation?\n\nThe current step finishes, then a report is written from the evidence found so far.")) return;

    try { await post(`/investigations/${run.id}/stop`); } catch (e) { alert(e.message); b.disabled = false; b.textContent = "Stop"; }
  };
}
const stepLi = s => `<li><span class="node">${esc(s.node)}</span><span class="text">${esc(s.text)}${whyHtml(s)}</span></li>`;

function renderLive(run) {
  const el = $("live");

let watchSeq = 0;
async function watchLive(id) {
  if (stream) { stream.close(); stream = null; }
  // claim the live view before the fetch: the 4 s poll must not start a second watch (two streams = every step twice)
  const mine = ++watchSeq;
  liveRun = id;
  let run;
  try { run = await api("/investigations/" + id); } catch (e) { return mine === watchSeq && renderLiveIdle(); }
  if (mine !== watchSeq) return;  // a newer watch took over while this one was loading
  renderLive(run);
  renderAgentRuns(run.agent_id);
  if (run.status !== "running") return;
  const es = stream = new EventSource(`/investigations/${id}/stream`);
  let seen = 0;
  es.addEventListener("step", e => {
    if (es !== stream || ++seen <= run.events.length || liveRun !== id) return;  // the stream replays steps already shown
    const s = JSON.parse(e.data);
    run.events.push(s);
    const ul = $("liveSteps");
    if (!ul) return;
    if ($("liveEmpty")) $("liveEmpty").remove();
    const atBottom = ul.scrollHeight - ul.scrollTop - ul.clientHeight < 40;
    ul.insertAdjacentHTML("beforeend", stepLi(s));
    if (atBottom) ul.scrollTop = ul.scrollHeight;
  });
  const finish = async () => {
    es.close();
    if (es !== stream) return;
    stream = null;
    await loadRuns();
    if (liveRun === id && $("live")) renderLive(await api("/investigations/" + id));
  };
  ["done", "failed", "waiting_input"].forEach(ev => es.addEventListener(ev, finish));
  es.onerror = () => { es.close(); if (es === stream) { stream = null; setTimeout(() => liveRun === id && $("live") && watchLive(id), 1500); } };
}

function renderAgentRuns(id) {
  const el = $("agentRuns");
  if (!el) return;
  if (AGENT_RUNS === null) { el.innerHTML = '<div class="hint"><span class="spinner"></span> Loading…</div>'; return; }
  const runs = AGENT_RUNS.filter(r => r.agent_id === id);
  const agent = AGENTS.find(x => x.id === id), max = agent ? agent.retention.max_investigations : 100;
  if ($("runCount")) { $("runCount").textContent = `· ${runs.length} / ${max}`; $("runCount").classList.toggle("warn-t", runs.length >= max); }
  if ($("start")) {
    const full = runs.length >= max;
    // one investigation per agent at a time: Start waits until the running one ends (or is stopped)
    const busy = runs.find(r => r.status === "running" || r.status === "waiting_input");
    $("start").disabled = full || !!busy;
    $("full").innerHTML = full ? `<div class="gap">Limit reached: ${runs.length} of ${max} investigations kept. Delete old ones (🗑 in the list) to start a new one.</div>`
      : busy ? `<div class="hint">One investigation at a time: <a href="#/run/${esc(busy.id)}">${esc(runTitle(busy.question))}</a> is in progress. Wait for it, or stop it.</div>` : "";
  }
  el.innerHTML = runs.length ? `<div class="run-list">${runs.map(r => `
    <div class="r ${r.id === liveRun ? "live" : ""}" data-run="${esc(r.id)}" title="${esc(r.question)}">
      ${r.status !== "running" ? `<button class="rm" data-rm="${esc(r.id)}" title="Delete investigation" aria-label="Delete investigation">🗑</button>` : ""}
      <div class="q">${esc(runTitle(r.question))}</div>

    </div>`).join("")}</div>` : '<div class="hint">No investigations yet.</div>';
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const r = (AGENT_RUNS || []).find(x => x.id === b.dataset.rm);

  });
  // a running investigation opens in the live panel; a finished one opens its report
  el.querySelectorAll("[data-run]").forEach(row => row.onclick = () => {
    const r = (AGENT_RUNS || []).find(x => x.id === row.dataset.run);
    if (r && r.status === "running" && $("live")) watchLive(r.id); else go("#/run/" + row.dataset.run);
  });
}

async function deleteRun(r) {
  if (!r || !confirm(`Delete this investigation?\n\n${runTitle(r.question)}\n\nIts report, steps and audit log are removed for good.`)) return false;
  try { await del(`/investigations/${r.id}`); } catch (e) { alert(e.message); return false; }
  await loadRuns();
  return true;
}

async function start(agentId) {
  const question = $("q").value.trim();

// ------------------------------------------------------------------ prompt versions

function lineDiff(oldText, newText) {
  // LCS over lines (prompts are a few hundred lines at most) → [["ctx"|"del"|"add", line]]
  const a = oldText.split("\n"), b = newText.split("\n"), n = a.length, m = b.length;
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push(["ctx", a[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push(["del", a[i++]]);
    else out.push(["add", b[j++]]);
  }
  while (i < n) out.push(["del", a[i++]]);
  while (j < m) out.push(["add", b[j++]]);
  return out;
}

function diffHtml(oldText, newText) {
  const rows = lineDiff(oldText, newText);
  if (!rows.some(r => r[0] !== "ctx")) return '<div class="hint">No differences.</div>';
  // show changes with 2 lines of context; fold the unchanged stretches between them
  const near = rows.map((_, i) => rows.slice(Math.max(0, i - 2), i + 3).some(r => r[0] !== "ctx"));
  const sign = {ctx: "  ", del: "- ", add: "+ "}, html = [];
  let folded = 0;
  rows.forEach(([k, line], i) => {
    if (!near[i]) { folded++; return; }
    if (folded) { html.push(`<div class="gap-line">  … ${folded} unchanged line${folded === 1 ? "" : "s"}</div>`); folded = 0; }
    html.push(`<div class="${k}">${sign[k]}${esc(line)}</div>`);
  });
  if (folded) html.push(`<div class="gap-line">  … ${folded} unchanged line${folded === 1 ? "" : "s"}</div>`);
  return `<div class="diff">${html.join("")}</div>`;
}

function wirePromptHistory(a, onChange) {
  let versions = null;
  const box = $("pHist");
  const when = t => new Date(t * 1000).toLocaleString([], {year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
  const render = () => {
    box.innerHTML = `<div class="card" style="margin:0;background:var(--bg)">
      <h2 style="margin-bottom:4px">Version history <span class="cnt">· ${versions.length}</span></h2>
      <div class="hint" style="margin:0 0 6px">Every saved change. Investigations record the version they ran with.
        <b>Make current</b> switches the agent back to an old version right away (no copy).
        <b>Load</b> puts it in the editor to change it first; Save then makes it a new version.</div>
      <div id="pvMsg"></div>
      ${versions.map(v => `<div class="pv-row">
        <span class="v">v${v.version}</span>
        <div><div>${esc(v.note || (v.version === a.prompt_version ? "current" : "edited"))}${v.version === a.prompt_version ? " " + badge("current", "ok") : ""}</div>
          <div class="hint" style="margin:0">${when(v.created_at)} · ${v.prompt.length.toLocaleString()} chars</div></div>
        <div class="row-actions"><button class="btn small" data-cmp="${v.version}">Compare with editor</button>
          ${v.version !== a.prompt_version ? `<button class="btn small" data-use="${v.version}">Make current</button>
            <button class="btn small" data-load="${v.version}">Load</button>` : ""}</div>
      </div><div id="pvDiff${v.version}"></div>`).join("")}</div>`;
    box.querySelectorAll("[data-cmp]").forEach(b => b.onclick = () => {
      const v = versions.find(x => x.version === +b.dataset.cmp), el = $("pvDiff" + v.version);
      el.innerHTML = el.innerHTML ? "" : `<div class="hint" style="margin:6px 0 0">− v${v.version} · + editor</div>` + diffHtml(v.prompt, $("prompt").value);
    });
    box.querySelectorAll("[data-use]").forEach(b => b.onclick = async () => {
      const v = versions.find(x => x.version === +b.dataset.use);
      if ($("prompt").value.trim() !== (a.prompt || "").trim() && !confirm("Discard your unsaved changes in the editor?")) return;
      try {
        const saved = await post(`/agents/${a.id}/prompt-versions/${v.version}/activate`);
        a.prompt = saved.prompt; a.prompt_version = saved.prompt_version; a.prompt_is_default = saved.prompt_is_default;
        $("prompt").value = a.prompt; $("prompt").scrollTop = 0; $("pNote").value = "";
        $("pVer").textContent = "v" + a.prompt_version;
        onChange(); render();
        $("pvMsg").innerHTML = `<div class="hint" style="margin:0 0 6px">✓ v${v.version} is now in use. New investigations run with it.</div>`;
      } catch (e) { $("pvMsg").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    });
    box.querySelectorAll("[data-load]").forEach(b => b.onclick = () => {
      const v = versions.find(x => x.version === +b.dataset.load);
      if ($("prompt").value.trim() !== (a.prompt || "").trim() && !confirm("Replace your unsaved changes in the editor?")) return;
      $("prompt").value = v.prompt;
      onChange();
      $("pNote").value = `restored from v${v.version}`;
      $("prompt").scrollTop = 0;
    });
  };
  $("pHistBtn").onclick = async () => {
    if (box.style.display !== "none") { box.style.display = "none"; return; }
    box.style.display = "";
    box.innerHTML = '<div class="hint"><span class="spinner"></span> Loading…</div>';
    try { versions = await api(`/agents/${a.id}/prompt-versions`); render(); box.scrollIntoView({block: "nearest", behavior: "smooth"}); }
    catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
}

  $("afAdd").onclick = () => { AF.push({name: "", type: "text", values: "", description: ""}); afRender(); };

    catch (e) { $("err").textContent = e.message; }
  };
  if (a) $("delete").onclick = async () => {
    if (!confirm(`Delete agent "${a.name}"? Past investigations stay.`)) return;
    try { await del(`/agents/${a.id}`); go("#/agents"); } catch (e) { $("err").textContent = e.message; }
  };
}

function fieldInput(f, value) {
  const id = "f_" + f.key, v = value ?? f.default;
  const req = f.required ? " *" : "";
  let input;
  if (f.type === "select") input = `<select id="${id}">${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.type === "bool") input = `<div class="checks"><label><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(f.label)}</label></div>`;
  else if (f.type === "list") input = `<input id="${id}" value="${esc((v || []).join(", "))}" placeholder="comma separated">`;
  else if (f.type === "json") input = `<textarea class="mono" id="${id}" placeholder="{}">${v && Object.keys(v).length ? esc(JSON.stringify(v, null, 2)) : ""}</textarea>`;
  else input = `<input id="${id}" type="${f.type === "number" ? "number" : "text"}" value="${esc(v ?? "")}">`;
  const label = f.type === "bool" ? "" : `<label for="${id}">${esc(f.label)}${req}</label>`;
  return `<div>${label}${input}${f.help ? `<div class="hint">${esc(f.help)}</div>` : ""}</div>`;
}

function secretInput(s, isSet) {
  const id = "s_" + s.key, ph = isSet ? "Saved — leave blank to keep" : (s.required ? "Required" : "Optional");
  const input = s.multiline ? `<textarea class="mono" id="${id}" placeholder="${ph}" autocomplete="off"></textarea>`
                            : `<input id="${id}" type="password" placeholder="${ph}" autocomplete="new-password">`;
  return `<div><label for="${id}">${esc(s.label)}${s.required ? " *" : ""} ${isSet ? badge("saved", "ok") : ""}</label>${input}
    ${s.help ? `<div class="hint">${esc(s.help)}</div>` : ""}</div>`;
}

async function renderConnectorForm(id, typeName) {
  const existing = id ? await api(`/connectors/${id}`).catch(() => null) : null;
  if (id && !existing) { $("main").innerHTML = '<div class="empty">Connector not found</div>'; return; }
  const t = TYPES.find(x => x.type === (existing ? existing.type : typeName));
  if (!t) { $("main").innerHTML = '<div class="empty">Unknown connector type</div>'; return; }
  const settings = existing ? existing.settings : {};
  const provides = existing ? existing.provides : t.capabilities;
  $("main").innerHTML = `
    <h1>${existing ? "Edit" : "Add"} ${esc(t.label)} connector</h1>
    <div class="sub">${esc(t.doc.split("\n\n")[0].replace(/\s+/g, " "))}</div>
    <div class="card">
      <h2>General</h2>
      <div class="grid2">
        <div><label for="name">Name *</label><input id="name" value="${esc(existing ? existing.name : t.label + " prod")}"></div>
        <div><label for="mode">Mode</label><select id="mode">
          <option value="live" ${!existing || existing.mode === "live" ? "selected" : ""}>Live — connect to the real system</option>
          <option value="fake" ${existing && existing.mode === "fake" ? "selected" : ""}>Demo data — no connection</option></select></div>
      </div>
      <label>Use this connector for</label>
      <div class="checks">${t.capabilities.map(c => `<label><input type="checkbox" class="cap" value="${esc(c)}" ${provides.includes(c) ? "checked" : ""}> ${esc(CAP_LABEL[c] || c)}</label>`).join("")}</div>
    </div>
    <div class="card"><h2>Connection</h2><div class="grid2">${t.fields.map(f => fieldInput(f, settings[f.key])).join("")}</div></div>
    ${t.secrets.length ? `<div class="card"><h2>Credentials</h2>
      <div class="hint" style="margin-bottom:6px">Stored encrypted. Never shown again after saving. Read-only credentials are recommended — a key that can also write is accepted with a warning.</div>
      <div class="grid2">${t.secrets.map(s => secretInput(s, existing && existing.secrets_set.includes(s.key))).join("")}</div></div>` : ""}
    <div class="card"><h2>Notes for the agent <span id="nBadge"></span></h2>
      <div class="hint" style="margin-bottom:8px">How to use this data source — added to the prompt of every agent that uses this connector.
        Describe your data: field meanings, log line format, ID formats, what important messages look like.</div>
      <textarea id="notes" class="mono notes-box" spellcheck="false">${esc(existing ? existing.notes : t.default_notes)}</textarea>
      <div class="row-actions" style="margin-top:8px"><button class="btn small" id="nReset">Reset to default</button></div>
    </div>
    <div class="card">
      <div class="row-actions">
        <button class="btn" id="test">Test connection</button>
        <button class="btn primary" id="save">${existing ? "Save" : "Save connector"}</button>
        <button class="btn" onclick="go('#/connectors')">Cancel</button>
      </div>
      <div id="result"></div>
    </div>`;

  const read = () => {
    const s = {}, sec = {};
    t.fields.forEach(f => { const el = $("f_" + f.key); s[f.key] = f.type === "bool" ? el.checked : el.value; });
    t.secrets.forEach(x => { const v = $("s_" + x.key).value; if (v) sec[x.key] = v; });
    return {id: existing ? existing.id : undefined, type: t.type, name: $("name").value, mode: $("mode").value,
            provides: [...document.querySelectorAll(".cap:checked")].map(c => c.value), settings: s, secrets: sec,
            notes: $("notes").value};
  };
  const nState = () => {
    const custom = $("notes").value.trim() !== t.default_notes.trim();
    $("nBadge").innerHTML = badge(custom ? "customized" : "default", custom ? "src" : "ok");
  };
  $("notes").oninput = nState;
  $("nReset").onclick = () => { $("notes").value = t.default_notes; nState(); };
  nState();
  const show = (ok, text) => $("result").innerHTML = `<div class="result ${ok ? "ok" : "bad"}">${esc(text)}</div>`;
  $("test").onclick = async () => {
    $("result").innerHTML = '<div class="hint" style="margin-top:12px"><span class="spinner"></span> Testing read and write access…</div>';
    try { const r = await post("/connectors/test", read()); show(r.ok, (r.ok ? "✓ " : "✗ ") + r.detail); }
    catch (e) { show(false, e.message); }
  };
  $("save").onclick = async () => {
    try {
      const body = read();
      const saved = existing ? await put(`/connectors/${existing.id}`, body) : await post("/connectors", body);
      await post(`/connectors/${saved.id}/test`);  // record status right away
      go("#/connectors");
    } catch (e) { show(false, e.message); }
  };
}


// ------------------------------------------------------------------ run view

async function openRun(id) {
  current = id;
  let run;
  try { run = await api("/investigations/" + id); activeAgent = run.agent_id; } catch (e) { $("main").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderRun(run);
  if (run.status === "running") follow(run);
}

function follow(run) {
  stream = new EventSource(`/investigations/${run.id}/stream`);
  let seen = 0;
  stream.addEventListener("step", e => {
    seen++;
    if (seen <= run.events.length) return;  // already rendered from the initial fetch
    const s = JSON.parse(e.data);
    run.events.push(s);
    $("steps").insertAdjacentHTML("beforeend", stepLi(s));
  });
  const finish = async () => { stream.close(); stream = null; await loadRuns(); if (current === run.id) openRun(run.id); };
  ["done", "failed", "waiting_input"].forEach(ev => stream.addEventListener(ev, finish));
  stream.onerror = () => { if (stream) { stream.close(); stream = null; setTimeout(() => current === run.id && openRun(run.id), 1500); } };
}

function renderRun(run) {
  const running = run.status === "running";
  $("main").innerHTML = `
    <a class="crumb" href="#/agents">Agents</a> <span class="crumb">/</span> <a class="crumb" href="#/agent/${esc(run.agent_id)}">${esc(run.agent)}</a>
    <div class="card">
      <div class="run-head">
        <div><h1 title="${esc(run.question)}" style="overflow-wrap:anywhere">${esc(runTitle(run.question))}</h1>
          <div class="sub" style="margin:0">${esc(run.agent)} · started ${ago(run.created)}${run.prompt_version ? ` · instructions v${run.prompt_version}` : ""} ${run.source !== "chat" ? "· from " + badge(run.source, "src") : ""}</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex:none">${running ? '<span class="spinner"></span> ' : ""}${badge(run.status)}
          ${stopBtn(run, "stopRun")}${!running ? '<button class="btn small danger" id="delRun">Delete</button>' : ""}</div>
      </div>
    </div>
    ${run.status === "waiting_input" ? askCard(run) : ""}
    ${run.status === "failed" ? `<div class="card ask"><h2>Failed</h2><div class="mono">${esc(run.error)}</div></div>` : ""}
    ${run.verdict ? reportCards(run) : ""}
    <div class="card">
      <h2>Steps ${running ? '<span class="spinner"></span>' : ""}</h2>
      <ul class="steps" id="steps">${run.events.map(stepLi).join("")}</ul>
      ${!run.events.length ? `<div class="hint">${running ? "Starting…" : "No steps finished yet."}</div>` : ""}
    </div>
    ${run.audit && run.audit.length ? auditCard(run) : ""}`;
  if (run.status === "waiting_input") wireAsk(run);
  if ($("delRun")) $("delRun").onclick = async () => { if (await deleteRun(run)) go("#/agent/" + run.agent_id); };
  wireStop(run, "stopRun");
  document.querySelectorAll("tr.ev").forEach(tr => tr.onclick = () => tr.nextElementSibling.hidden = !tr.nextElementSibling.hidden);
}

function askCard(run) {
  const i = run.interrupt || {};
  return `<div class="card ask"><h2>${esc(i.question || "The agent needs input")}</h2>
    <div class="opts">${(i.options || []).map(o => `<button class="btn" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input id="answer" placeholder="Or type an answer"><button class="btn primary" id="send">Continue</button></div>
    <div class="err" id="askErr"></div></div>`;
}

function wireAsk(run) {
  const send = async answer => {
    if (!answer) return;
    try { await api(`/investigations/${run.id}/resume`, {method: "POST", body: JSON.stringify({answer})}); openRun(run.id); loadRuns(); }
    catch (e) { $("askErr").textContent = e.message; }
  };
  document.querySelectorAll("[data-answer]").forEach(b => b.onclick = () => send(b.dataset.answer));
  $("send").onclick = () => send($("answer").value.trim());
  $("answer").onkeydown = e => { if (e.key === "Enter") send($("answer").value.trim()); };
}

function reportCards(run) {
  const v = run.verdict, r = (run.result || {}).report;
  if (v.status === "out_of_scope") {
    return `<div class="card"><h2>Refused ${badge("out_of_scope")}</h2><div>${esc(v.problems[0])}</div>
      <div class="hint">Ask the agent that owns this service, or widen this agent's scope.</div></div>`;
  }
  if (!r) return `<div class="card"><pre class="raw">${esc(run.report)}</pre></div>`;  // older investigations
  const sec = (n, title, body, extra = "") => `<div class="card rep"><h2><span class="sec-n">${n}</span>${title}${extra}</h2>${body}</div>`;
  const list = items => items.length ? `<ul class="rep-list">${items.map(x => `<li>${x}</li>`).join("")}</ul>` : "";
  const rc = r.root_cause, im = r.impact, cv = r.coverage, cd = r.confidence_detail;

  const head = `<div class="card"><div class="summary-grid">
      <div class="stat"><div class="k">Status</div><div class="v">${badge(v.status)}</div></div>
      <div class="stat"><div class="k">Confidence</div><div class="v">${badge(v.confidence)}</div></div>
      <div class="stat"><div class="k">Service</div><div class="v">${esc(im.service || "unknown")} · ${esc(im.symptom)}</div></div>
      <div class="stat"><div class="k">Effort</div><div class="v">${esc(cv.effort.queries)} queries · ${esc(cv.effort.turns)} turns</div></div>
    </div></div>`;

  const card = (title, body, extra = "") => `<div class="card rep"><h2>${title}${extra}</h2>${body}</div>`;
  const s1 = r.answer
    ? sec(1, "Answer", `<div class="cause">${esc(r.answer.statement)}</div>
       <div class="hint" style="margin-top:8px">Evidence ${esc(r.answer.evidence_ids.join(", "))} · a direct answer to the question, not a root-cause analysis</div>`)
    : sec(1, "Root Cause", rc
    ? `<div class="cause">${esc(rc.statement)}</div>
       <div class="hint" style="margin-top:8px">Hypothesis: ${esc(rc.hypothesis)} · supported by <b>${esc(rc.signals.join(", "))}</b> · evidence ${esc(rc.evidence_ids.join(", "))}</div>`
    : `<div class="gap">Not determined. ${esc(r.summary)}</div>`);

  const fmt = v => v === null || v === undefined ? '<span class="hint">—</span>' : Array.isArray(v) ? (v.length ? esc(v.join(", ")) : '<span class="hint">—</span>')
    : typeof v === "boolean" ? badge(v ? "yes" : "no", v ? "ok" : "src") : esc(String(v));
  const sA = (r.analysis || []).length ? card("Analysis", `<table><thead><tr><th>Field</th><th>Value</th><th>Evidence</th><th>Check</th></tr></thead><tbody>
    ${r.analysis.map(x => `<tr><td class="mono nw">${esc(x.name)}</td><td>${fmt(x.value)}</td><td class="mono nw">${esc(x.evidence_ids.join(", ")) || "—"}</td>
      <td>${x.problems.length ? `<span class="gap" style="padding:2px 6px">⚠ ${esc(x.problems.join("; "))}</span>` : '<span class="hint">type ok</span>'}</td></tr>`).join("")}</tbody></table>`,
    '<span class="model-tag">model-extracted · not verified like the sections below</span>') : "";

  const ap = r.affected_pods;
  const sP = ap ? card("Affected Pods", `<div class="hint" style="margin-bottom:8px">${esc(ap.ready)}/${esc(ap.total)} ready
      ${ap.deployment ? `· deployment <b>${esc(ap.deployment.name)}</b> ${esc(ap.deployment.available)}/${esc(ap.deployment.desired)} available, ${esc(ap.deployment.updated)} updated` : ""}
      ${ap.hpa ? `· HPA ${esc(ap.hpa.current)}→${esc(ap.hpa.desired)} (min ${esc(ap.hpa.min)}, max ${esc(ap.hpa.max)})` : ""} · evidence ${esc(ap.evidence)}</div>
    ${ap.deployment && ap.deployment.problems.length ? `<div class="gap">${esc(ap.deployment.problems.join("; "))}</div>` : ""}
    <table><thead><tr><th>Pod</th><th>Ready</th><th>Restarts</th><th>State</th><th>Last exit</th><th>Node</th></tr></thead><tbody>
    ${ap.pods.map(p => `<tr><td class="mono">${esc(p.pod)}</td><td class="${p.ready ? "" : "bad"}">${p.ready ? "yes" : "NO"}</td><td>${esc(p.restarts)}</td>
      <td class="${p.waiting ? "bad" : ""}">${esc(p.waiting || p.phase)}</td>
      <td>${p.last_exit ? `${esc(p.last_exit.reason)} (${esc(p.last_exit.exit_code)}) at ${esc(p.last_exit.at)}${p.last_exit.recent ? " ⚠" : ""}` : "—"}</td>
      <td class="hint">${esc(p.node || "—")}</td></tr>`).join("")}</tbody></table>`) : "";

  const sH = (r.hypotheses || []).length ? card("Hypotheses", `<table><thead><tr><th>ID</th><th>Hypothesis</th><th>Status</th><th>Evidence</th></tr></thead><tbody>
    ${r.hypotheses.map(h => `<tr><td class="mono nw">${esc(h.id)}${h.cause ? " ★" : ""}</td><td>${esc(h.statement)}</td><td>${badge(h.status)}</td>
      <td class="mono">${esc(h.evidence_ids.join(", ")) || "—"}</td></tr>`).join("")}</tbody></table>`, ' <span class="hint">★ the cause</span>') : "";

  const s2 = sec(2, "Impact", `
    ${im.alert ? `<div class="next" style="margin-top:0;margin-bottom:10px">From alert link: <b>${esc(im.alert.name || "monitor " + im.alert.monitor_id)}</b>
       ${im.alert.state ? badge(im.alert.state, "MEDIUM") : ""} <span class="hint">monitor ${esc(im.alert.monitor_id)} · window ${esc(im.window_from)} → ${esc(im.window_to || "now")}</span>
       ${(im.alert.notes || []).map(n => `<div class="hint">⚠ ${esc(n)}</div>`).join("")}</div>` : ""}
    ${im.statement ? `<p style="margin-top:0">${esc(im.statement)}</p>` : ""}
    ${list([...im.alerts.map(x => "🔔 " + esc(x)), ...im.metrics.map(x => "📈 " + esc(x)), ...(im.pods || []).map(x => "☸ " + esc(x))])}
    ${im.detected ? `<div class="next">Affected service detected automatically: <b>${esc(im.service)}</b> — ${esc(im.detected.reasons.join(", "))}
       <span class="hint">(checked ${esc(im.detected.checked.join(", "))})</span></div>` : ""}
    ${Object.keys(im.also_unusual).length ? `<div class="gap">Also unusual: ${esc(Object.entries(im.also_unusual).map(([k, x]) => k + " (" + x.join(", ") + ")").join("; "))}</div>` : ""}
    ${!im.statement && !im.alerts.length && !im.metrics.length && !(im.pods || []).length && !im.detected ? '<div class="hint">No active alerts, rising metrics or unhealthy pods recorded.</div>' : ""}`);

  const s3 = sec(3, "Summary", `<p style="margin-top:0">${esc(r.summary)}</p>
    ${r.timeline.length ? `<div class="timeline">${r.timeline.map(x => `<div class="tl"><span class="tl-t mono">${esc(x.time)}</span>
      <span class="tl-e">${esc(x.event)} <span class="hint">[${esc(x.evidence)}]</span></span></div>`).join("")}</div>` : ""}`);

  const s4 = sec(4, "Evidence", `<table><thead><tr><th>ID</th><th>Capability</th><th>Source</th><th>Tests</th><th>Finding</th></tr></thead><tbody>
    ${r.evidence.map(e => `<tr class="ev ${e.cited ? "cited" : ""}"><td class="mono nw">${esc(e.id)}${e.cited ? " ★" : ""}</td>
      <td class="mono nw">${esc(e.capability)}</td><td class="nw">${esc(e.source)}</td><td class="nw">${esc(e.tests)}</td><td>${esc(e.finding)}</td></tr>
      <tr class="nq" hidden><td colspan="5">${esc(e.query)}</td></tr>`).join("")}</tbody></table>`,
    ' <span class="hint">★ cited for the root cause · click a row for the query</span>');

  const s5 = sec(5, "Recommendations", r.recommendations.length
    ? `<ol class="rep-list">${r.recommendations.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
       <div class="hint">The agent is read-only: it suggests, it never acts.</div>` : '<div class="hint">None.</div>');

  const conn = x => x.queries ? `${x.queries} queries · ${x.unusual} unusual${x.failed ? ` · ${x.failed} failed` : ""}` : "not queried";
  const s6 = sec(6, "Investigation Coverage", `
    ${(cv.by_connector || []).length ? `<label>Connectors</label><div class="cov">${cv.by_connector.map(x =>
      badge((x.queries ? (x.unusual ? "● " : "✓ ") : "✗ ") + x.connector + " · " + conn(x), x.queries ? (x.unusual ? "MEDIUM" : "ok") : "LOW")).join("")}</div>` : ""}
    <div class="grid2">
    <div><label>Checked</label><div class="cov">${cv.checked.map(x => badge("✓ " + x.capability + " · " + x.source, "ok")).join("") || "—"}</div></div>
    <div><label>Not checked</label><div class="cov">${cv.not_checked.map(x => badge("✗ " + x, "MEDIUM")).join("") || '<span class="hint">nothing missing</span>'}</div></div>
    <div><label>Services</label><div class="hint">${esc(cv.services_checked.filter(Boolean).join(", "))}</div></div>
    <div><label>Effort</label><div class="hint">${esc(cv.effort.queries)} queries · ${esc(cv.effort.tool_calls)} tool calls · ${esc(cv.effort.turns)} turns · stop: ${esc(cv.effort.stop)}</div></div>
    </div>
    <label>Hypotheses tested</label>${cv.hypotheses.map(h => `<div class="hyp">${badge(h.status)}<span><b>${esc(h.id)}</b> ${esc(h.statement)}</span></div>`).join("") || '<div class="hint">none</div>'}
    ${cv.connectors_skipped.length ? `<div class="gap">Connectors skipped: ${esc(cv.connectors_skipped.join("; "))}</div>` : ""}`);

  const s7 = sec(7, "Confidence & Limitations", `<div style="margin-bottom:8px">${badge(cd.level)}</div>
    ${list(cd.why.map(x => "✓ " + esc(x)))}
    <label>Limitations</label>${list(cd.limitations.map(x => "⚠ " + esc(x)))}
    <details style="margin-top:12px"><summary>Report as text (markdown)</summary><pre class="raw">${esc(run.report)}</pre></details>`);

  return head + s1 + sA + s2 + sP + s3 + s4 + sH + s5 + s6 + s7;
}

function auditCard(run) {
  return `<div class="card"><details><summary><b>Audit log</b> · ${run.audit.length} gateway calls</summary>
    <table style="margin-top:10px"><thead><tr><th>Decision</th><th>Capability</th><th>Connector</th><th>Query / reason</th></tr></thead><tbody>
    ${run.audit.map(a => `<tr><td>${badge(a.decision)}</td><td class="mono">${esc(a.capability)}</td><td>${esc(a.connector || "-")}</td>
      <td class="mono">${esc(a.native_query || a.reason)}</td></tr>`).join("")}</tbody></table></details></div>`;
}



// ------------------------------------------------------------------ boot

(async function boot() {
  try {
    [TYPES, AGENT_TYPES] = await Promise.all([api("/connector-types"), api("/agent-types")]);
    $("health").textContent = "read-only agents";
  } catch (e) { $("main").innerHTML = `<div class="empty">Cannot reach the server: ${esc(e.message)}</div>`; return; }
  RUNS = await api("/investigations").catch(() => []);
  wireTheme();
  window.onhashchange = route;
  await route();
  setInterval(loadRuns, 4000);  // running status + alert-triggered runs appear without a refresh
})();
</script>
